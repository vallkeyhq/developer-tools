name: Publish
# Publishes a package when its release tag is pushed, such as cli-v0.9.0 or python-v0.4.0.
# npm and PyPI trust this file by name through the release environment, so no token is
# stored anywhere. Renaming the file or the environment breaks publishing. See docs/releases.md.
on:
  push:
    tags: ['cli-v*', 'python-v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only a commit on main, with the version the tag names
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          case "$TAG" in
            cli-v*)
              have=$(node -p "require('./cli/package.json').version")
              test "cli-v$have" = "$TAG"
              ;;
            python-v*)
              have=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)
              test "python-v$have" = "$TAG"
              grep -qxF "__version__ = \"$have\"" python/src/vallkey/__init__.py
              ;;
            *) exit 1 ;;
          esac
  npm:
    if: startsWith(github.ref_name, 'cli-v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:artifacts
      - run: npm run check:package
      - run: npm publish --access public
        working-directory: cli
  pypi:
    if: startsWith(github.ref_name, 'python-v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install ./python -r python/requirements-test.txt
      - run: python -m unittest discover -s python/tests
        env:
          VALLKEY_REQUIRE_TEST_DEPS: '1'
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build python
      - run: python -m twine check --strict python/dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: python/dist
